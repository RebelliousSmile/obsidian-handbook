name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  path: handbook

            - name: Read schema-adrenaline pin
              id: schema-ref
              working-directory: handbook
              run: echo "sha=$(cat compat/schema-adrenaline.ref)" >> "$GITHUB_OUTPUT"

            - name: Checkout pinned schema-adrenaline
              uses: actions/checkout@v4
              with:
                  repository: RebelliousSmile/schema-adrenaline
                  ref: ${{ steps.schema-ref.outputs.sha }}
                  path: schema-adrenaline

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"

            - name: Install dependencies
              working-directory: handbook
              run: npm install

            - name: Install schema-adrenaline dependencies
              working-directory: schema-adrenaline
              run: npm ci

            - name: Check Handbook
              working-directory: handbook
              env:
                  SCHEMA_ADRENALINE_ROOT: ${{ github.workspace }}/schema-adrenaline
              run: npm run check

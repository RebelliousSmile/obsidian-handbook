name: Create a new release

# Publishing is an explicit maintainer action; tags alone never create a
# GitHub release or consume Actions minutes.
on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  path: handbook

            - name: Checkout Lantern contract pins
              uses: actions/checkout@v4
              with:
                  repository: RebelliousSmile/lantern
                  path: lantern

            - name: Checkout schema provider descriptors
              uses: actions/checkout@v4
              with:
                  repository: RebelliousSmile/schema-pbta
                  path: schema-pbta

            - uses: actions/checkout@v4
              with:
                  repository: RebelliousSmile/schema-in-the-mist
                  path: schema-in-the-mist

            - uses: actions/checkout@v4
              with:
                  repository: RebelliousSmile/schema-adrenaline
                  path: schema-adrenaline

            # Same installer as CI: pnpm-lock.yaml is the only lockfile this repo tracks.
            - name: Use pnpm
              uses: pnpm/action-setup@v4
              with:
                  # The checkout lands in handbook/, and this action reads `packageManager` from the
                  # workspace root, not from the checkout: without this it resolves no pnpm version
                  # at all and the job dies before installing anything.
                  package_json_file: handbook/package.json

            - name: Use Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20.x"
                  cache: pnpm
                  cache-dependency-path: handbook/pnpm-lock.yaml

            - name: Install dependencies
              working-directory: handbook
              run: pnpm install --frozen-lockfile

            - name: Check plugin
              working-directory: handbook
              run: pnpm check

            # `pnpm check` proves the four version-bearing files agree with each other. Only here is
            # the tag known, and only here does a disagreement actually ship: v2.16.0 through v2.19.1
            # were all published from a manifest declaring 2.15.3.
            - name: Assert the tag matches the shipped manifest
              working-directory: handbook
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: node tools/assert-release-version.mjs

            - name: Install pinned Obsidian host
              run: |
                  sudo apt-get update
                  sudo apt-get install -y xvfb
                  python3 -m pip install websocket-client
                  curl -fsSL -o /tmp/Obsidian.AppImage https://github.com/obsidianmd/obsidian-releases/releases/download/v1.13.7/Obsidian-1.13.7.AppImage
                  echo 'e0d8e0a611624de8c9c7dcd8a9e648279fb0a0d552faa1312b7e4f3a5fa72663  /tmp/Obsidian.AppImage' | sha256sum -c -
                  chmod +x /tmp/Obsidian.AppImage
                  cd /tmp
                  ./Obsidian.AppImage --appimage-extract >/dev/null

            - name: Load release artifact in Obsidian 1.13.7
              working-directory: handbook
              env:
                  HANDBOOK_E2E_OBSIDIAN: /tmp/squashfs-root/AppRun
                  HANDBOOK_E2E_OUTPUT_DIR: ${{ runner.temp }}/handbook-plugin-load
              run: xvfb-run -a pnpm e2e:plugin-load

            - name: Upload plugin-load diagnostics
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: handbook-release-plugin-load
                  path: ${{ runner.temp }}/handbook-plugin-load
                  if-no-files-found: ignore

            - name: Create release
              working-directory: handbook
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  release_flags=()
                  if [[ "$tag" == *-* ]]; then
                    release_flags+=(--prerelease)
                  fi

                  release_assets=(dist/main.js dist/manifest.json dist/styles.css)

                  if gh release view "$tag" >/dev/null 2>&1; then
                    gh release upload "$tag" --clobber "${release_assets[@]}"
                  else
                    gh release create "$tag" \
                      --title="$tag" \
                      "${release_flags[@]}" \
                      "${release_assets[@]}"
                  fi
